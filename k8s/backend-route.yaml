apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bandcheck-backend
  namespace: bandcheck
  labels:
    externaldns.kubernetes.io/enabled: "true"
  annotations:
    external-dns.kubernetes.io/cloudflare-proxied: "true"
    external-dns.kubernetes.io/cloudflare-custom-hostname: bandcheck-api.cloud.marcodoes.tech
spec:
  parentRefs:
    - name: cluster
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - bandcheck-api.cloud.marcodoes.tech
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: add-api-prefix
      backendRefs:
        - name: bandcheck-backend
          port: 80
